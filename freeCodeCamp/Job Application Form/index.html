<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <h1>Job Application Form</h1>

        <form action="">

            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="position">Position: </label>
            <select name="selecao" id="position" required>
                <option value="">
                    Select a position
                </option>
                <option value="option1">
                    Developer
                </option>
                <option value="option2">
                    Designer
                </option>
                <option value="option3">
                    Manager
                </option>
            </select>

            <fieldset class="radio-group">
                <legend>Availability</legend>

                <input type="radio" name="availability" id="b1" checked>
                <label for="b1" class="botao">Full-Time</label>

                <input type="radio" name="availability" id="b2">
                <label for="b2" class="botao">Part-Time</label>

            </fieldset>

            <label for="message">Why do you want this job?</label>
            <textarea name="" id="message" placeholder="Write your motivation" required rows="7"></textarea>

            <button type="submit">Submit Application</button>

        </form>
    </div>

</body>
