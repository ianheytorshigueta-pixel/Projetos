<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="bloco">
        <h1>My To-Do List</h1>

        <ul class="todo-list">
            <li>
                <input type="checkbox" id="keyboard">
                <label for="keyboard">Explore gaming keyboards</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">Store link</a>
                    </li>
                </ul>
            </li>

            <li>
                <input type="checkbox" id="report">
                <label for="report">Finish the report</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">Request Access</a>
                    </li>
                </ul>
            </li>

            <li>
                <input type="checkbox" id="phone">
                <label for="phone">View Phone's Warranty</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">View Receipts</a>
                    </li>
                </ul>
            </li>

            <li>
                <input type="checkbox" id="specs">
                <label for="specs">Check Processor Specs</label>
                <ul class="sub-item">
                    <li>
                        <a class="sub-item-link" href="https://www.freecodecamp.org/" target="_blank">View Model Number</a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</body>

</html>
